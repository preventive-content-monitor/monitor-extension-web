<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Bloqueado - Guardian</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-primary: #1d7cce;
        --brand-secondary: #7d41c4;
        --brand-tertiary: #1e3a8a;
        --danger: #df4f5a;
        --danger-light: #ffe6e7;
        --text: #172849;
        --text-secondary: #4d6089;
        --bg: #edf3ff;
        --card-bg: #ffffff;
        --radius: 18px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Open Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(
            940px 420px at 10% -20%,
            rgba(125, 65, 196, 0.23),
            transparent 65%
          ),
          radial-gradient(
            920px 380px at 100% 10%,
            rgba(29, 124, 206, 0.2),
            transparent 64%
          ),
          linear-gradient(180deg, #f2f6ff 0%, var(--bg) 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: var(--card-bg);
        border-radius: var(--radius);
        border: 1px solid rgba(90, 134, 214, 0.2);
        box-shadow: 0 22px 52px rgba(21, 45, 108, 0.24);
        max-width: 560px;
        width: 100%;
        text-align: center;
        overflow: hidden;
      }

      .header {
        background: linear-gradient(
          125deg,
          var(--brand-tertiary),
          var(--brand-primary) 55%,
          var(--brand-secondary)
        );
        padding: 28px 28px 34px;
        color: white;
        position: relative;
        overflow: hidden;
      }

      .header::after {
        content: "";
        position: absolute;
        width: 260px;
        height: 260px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.2),
          transparent 70%
        );
        right: -70px;
        top: -130px;
      }

      .brand-mark {
        width: 210px;
        max-width: 80%;
        height: auto;
        filter: drop-shadow(0 8px 16px rgba(10, 22, 64, 0.36));
        margin: 0 auto 16px;
        position: relative;
        z-index: 1;
      }

      .badge {
        width: 72px;
        height: 72px;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        font-size: 30px;
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        position: relative;
        z-index: 1;
        animation: pulse 1.9s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      .header h1 {
        font-family: "Montserrat", sans-serif;
        font-size: 1.45rem;
        font-weight: 800;
        margin-bottom: 6px;
        letter-spacing: 0.2px;
        position: relative;
        z-index: 1;
      }

      .header p {
        opacity: 0.9;
        font-size: 0.9rem;
        position: relative;
        z-index: 1;
      }

      .content {
        padding: 24px;
      }

      .blocked-url {
        background: var(--danger-light);
        border: 2px solid var(--danger);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 18px;
        word-break: break-all;
        font-family: "Open Sans", sans-serif;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--danger);
      }

      .info-box {
        background: linear-gradient(
          135deg,
          rgba(29, 124, 206, 0.1),
          rgba(125, 65, 196, 0.08)
        );
        border: 1px solid rgba(29, 124, 206, 0.24);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 18px;
        text-align: left;
      }

      .info-box h3 {
        font-family: "Montserrat", sans-serif;
        font-size: 0.86rem;
        color: var(--text);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .info-box p {
        font-size: 0.85rem;
        color: var(--text-secondary);
        line-height: 1.5;
        margin: 0;
      }

      .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .btn {
        padding: 11px 17px;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(
          130deg,
          var(--brand-primary),
          var(--brand-secondary)
        );
        color: white;
        box-shadow: 0 12px 20px rgba(35, 73, 159, 0.22);
      }

      .btn-primary:hover {
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: #f4f8ff;
        color: var(--brand-tertiary);
        border: 1px solid rgba(29, 124, 206, 0.32);
      }

      .btn-secondary:hover {
        background: #edf4ff;
      }

      .footer {
        padding: 14px 22px;
        background: #f6f9ff;
        border-top: 1px solid #d9e4f7;
        font-size: 0.8rem;
        color: var(--text-secondary);
      }

      .footer a {
        color: var(--brand-primary);
        text-decoration: none;
      }

      .guardian-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 8px;
        font-weight: 600;
        color: var(--text);
      }

      .guardian-logo img {
        width: 120px;
        max-width: 65vw;
        height: auto;
      }

      .timestamp {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 16px;
      }

      @media (max-width: 560px) {
        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img class="brand-mark" src="../../assets/logo.png" alt="Guardian" />
        <div class="badge">G</div>
        <h1>Acesso Bloqueado</h1>
        <p>Este site foi bloqueado pelo seu responsável</p>
      </div>

      <div class="content">
        <div class="blocked-url" id="blockedUrl">Carregando...</div>

        <div class="info-box">
          <h3>🔒 Por que este site foi bloqueado?</h3>
          <p>
            Seu responsável configurou este site como não permitido para sua
            proteção. Se você acredita que isso é um erro, converse com ele.
          </p>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="btnBack">← Voltar</button>
          <a href="https://google.com" class="btn btn-secondary">
            🏠 Ir para Google
          </a>
        </div>

        <div class="timestamp" id="timestamp"></div>
      </div>

      <div class="footer">
        <div>Protegido por</div>
        <div class="guardian-logo">
          <img src="../../assets/logo.png" alt="Guardian" />
        </div>
      </div>
    </div>

    <script type="module" src="blocked.js"></script>
  </body>
</html>
